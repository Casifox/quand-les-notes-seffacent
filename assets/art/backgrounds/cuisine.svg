<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3aa92"/>
      <stop offset=".58" stop-color="#938d79"/>
      <stop offset="1" stop-color="#6f7062"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d534b" stop-opacity=".1"/>
      <stop offset=".6" stop-color="#5b5d51" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3b3d37" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aabbb1"/>
      <stop offset=".58" stop-color="#d2c8ae"/>
      <stop offset="1" stop-color="#7f8f85"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#746247"/>
      <stop offset=".12" stop-color="#4b4436"/>
      <stop offset="1" stop-color="#25241f"/>
    </linearGradient>
    <linearGradient id="cabinets" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6755"/>
      <stop offset="1" stop-color="#48493e"/>
