    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5f42"/>
      <stop offset="1" stop-color="#3c3126"/>
    </linearGradient>
    <linearGradient id="tabletop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7459"/>
      <stop offset=".45" stop-color="#67533e"/>
      <stop offset="1" stop-color="#3b3025"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6dfb0" stop-opacity=".46"/>
      <stop offset="1" stop-color="#f6dfb0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
