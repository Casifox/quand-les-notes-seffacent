<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10252f"/>
      <stop offset=".38" stop-color="#29454c"/>
      <stop offset=".68" stop-color="#7f6f68"/>
      <stop offset=".84" stop-color="#bd8d73"/>
      <stop offset="1" stop-color="#d2ad82"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#754f4c"/>
      <stop offset=".25" stop-color="#405d61"/>
      <stop offset="1" stop-color="#122f38"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c2d"/>
      <stop offset="1" stop-color="#0b171a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1c894" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#d29771" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d29771" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f2cf94" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#e3aa5d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d4934e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253334"/>
      <stop offset="1" stop-color="#0e1b1e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69655a"/>
      <stop offset="1" stop-color="#393d38"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3733"/>
      <stop offset="1" stop-color="#071114"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    </filter>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9bd87" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9bd87" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e9bd87" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1040" cy="642" rx="540" ry="240" fill="url(#sunGlow)"/>
  <circle cx="1068" cy="594" r="38" fill="#f5d3a0" opacity=".68" filter="url(#blur8)"/>

