    <g transform="translate(481 739) rotate(-3)">
      <path d="M0 0h149v23H0Z" fill="#534331"/>
      <path d="M5 23h141v20H5Z" fill="#3a3e35"/>
      <path d="M0 43h150v24H0Z" fill="#5b4a34"/>
      <path d="M10 8h100M16 31h94M12 53h106" stroke="#a58a67" stroke-width="1.2" opacity=".3"/>
    </g>
  </g>

