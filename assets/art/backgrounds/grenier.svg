<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3126"/>
      <stop offset=".56" stop-color="#241f1a"/>
      <stop offset="1" stop-color="#151413"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25221d"/>
      <stop offset="1" stop-color="#45382a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e271e"/>
      <stop offset="1" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d9c98"/>
      <stop offset=".55" stop-color="#63787a"/>
      <stop offset="1" stop-color="#3f565a"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4d39b" stop-opacity=".84"/>
      <stop offset=".3" stop-color="#daa967" stop-opacity=".24"/>
      <stop offset="1" stop-color="#c68f53" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#aabdb8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#8ca19f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57432f"/>
      <stop offset=".6" stop-color="#2d231b"/>
      <stop offset="1" stop-color="#171512"/>
    </linearGradient>
    <linearGradient id="boxShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5a43"/>
      <stop offset="1" stop-color="#3d3226"/>
    </linearGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur9"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#171714"/>

  <!-- Roof slopes -->
  <path d="M0 0h1600v104L1045 324 0 161Z" fill="url(#roof)"/>
  <path d="M0 0h595L0 137Z" fill="#100f0d"/>
  <path d="M1600 0h-346l346 139Z" fill="#100f0d"/>
  <g stroke="#0c0c0a" stroke-width="5" opacity=".68">
    <path d="M0 49 1600 5M0 125 1600 75M0 204 1600 145M0 282 1600 214M0 360 1600 284"/>
  </g>

  <!-- Back wall -->
  <path d="M0 158 1045 320v536H0Z" fill="url(#wood)"/>
  <path d="M1045 320 1600 95v761h-555Z" fill="#1d1b17"/>
  <g stroke="#0d0d0b" stroke-width="4" opacity=".5">
    <path d="M169 162v674M353 188v648M544 213v623M734 240v596M919 266v570M1102 293v543M1280 318v518M1451 341v496"/>
  </g>

  <!-- roof beams -->
  <g fill="#161411">
    <path d="M-30 190 1650 458l-5 42L-38 234Z" opacity=".9"/>
    <path d="M-20 451 1630 268l7 38L-20 492Z" opacity=".75"/>
    <path d="M-20 720 1600 590l7 34L-20 761Z" opacity=".58"/>
