    </g>
    <path d="M608 516h256v21H608Z" fill="#4a4133"/>
    <path d="M588 526h295v11H588Z" fill="#29251e"/>
    <ellipse cx="736" cy="370" rx="250" ry="220" fill="url(#windowGlow)"/>
  </g>

  <!-- Light beam from window -->
  <path d="M629 225 856 315 766 900H455Z" fill="#bac7b8" opacity=".035" filter="url(#blur30)"/>

