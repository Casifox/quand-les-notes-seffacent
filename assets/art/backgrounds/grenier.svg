    <path d="M1104 263h8v13h-8Z" fill="#77715c"/>
    <ellipse cx="1109" cy="304" rx="15" ry="18" fill="#eac37f"/>
    <ellipse cx="1109" cy="304" rx="8" ry="11" fill="#fff1c8" opacity=".9"/>
    <ellipse cx="1109" cy="303" rx="150" ry="120" fill="url(#bulbGlow)"/>
    <path d="M1098 286h20" stroke="#191a16" stroke-width="2"/>
