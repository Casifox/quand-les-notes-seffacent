    <path d="M93 581h208v24H93Z" fill="#887253"/>
    <path d="M133 605v203M257 605v203" stroke="#2d261f" stroke-width="7" opacity=".6"/>
    <path d="M129 638c39-18 78-18 117 0" stroke="#a68c68" stroke-width="2" fill="none" opacity=".18"/>
    <path d="M113 574c30-16 57-15 86 1l-19 19-49-3Z" fill="#a29074" opacity=".3"/>
