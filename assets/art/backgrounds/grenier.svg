      <path d="M11 14h67M10 24h53M14 35h63M17 46h41" stroke="#6f6655" stroke-width="1" opacity=".5"/>
      <path d="M72 4l18 38M63 7l21 44M52 6l24 46" stroke="#4d493d" stroke-width=".7" opacity=".45"/>
    </g>
    <g transform="translate(700 580) rotate(-5)">
