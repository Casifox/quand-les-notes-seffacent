      <path d="M9 11h58M9 20h41M11 29h52" stroke="#796b56" stroke-width="1" opacity=".35"/>
    </g>
  </g>

  <!-- Metronome on box -->
  <g transform="translate(499 647)">
    <path d="M0 69h46L88 0H45Z" fill="#2a2118"/>
    <path d="M51 9 19 62h37L79 8Z" fill="#0f0f0d"/>
    <path d="M69 5 53 49" stroke="#b49a6d" stroke-width="1.7"/>
    <path d="M59 40h14" stroke="#7c6c51" stroke-width="1.5"/>
    <path d="M0 69h92v7H0Z" fill="#151310"/>
    <path d="M32 70h5v10h-5Z" fill="#5d4f3a"/>
