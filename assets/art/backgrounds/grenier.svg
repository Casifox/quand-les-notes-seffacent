    <path d="M1158 444c20-4 42-2 60 7l-6 140h-48Z" fill="#333c39"/>
    <path d="M1172 476c14-8 26-8 38 0" fill="none" stroke="#55615a" stroke-width="1.2" opacity=".4"/>
