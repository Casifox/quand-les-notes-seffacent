    <path d="M1320 457c0-43 27-70 59-70s60 27 60 70v143h-119Z" fill="#384b4b" opacity=".55"/>
    <path d="M1320 513c33-11 64 1 93 33 9 10 17 16 26 18v56h-119Z" fill="#263a3b" opacity=".7"/>
    <path d="M1318 493c26-26 55-36 89-29" stroke="#9ba9a1" stroke-width="1" fill="none" opacity=".25"/>
