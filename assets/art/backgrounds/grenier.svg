    <path d="M637 428c48-16 94-11 133 4 27 11 54 9 93-2v73H637Z" fill="#334d51" opacity=".75"/>
    <path d="M637 350c40-20 77-19 113-4 34 14 63 16 98-2v41c-41 14-77 10-110-4-36-16-68-14-101 3Z" fill="#5d7471" opacity=".6"/>
