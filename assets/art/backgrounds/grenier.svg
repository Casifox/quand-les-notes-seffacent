  <!-- vignette and grain -->
  <ellipse cx="780" cy="465" rx="850" ry="470" fill="none" stroke="#050707" stroke-width="260" opacity=".27" filter="url(#blur30)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".1" style="mix-blend-mode:soft-light"/>
</svg>
