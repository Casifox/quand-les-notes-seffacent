    <path d="M1107 431h260v9h-260Z" fill="#1b1814"/>
    <path d="M1127 440v185M1344 440v185" stroke="#24231d" stroke-width="5"/>
    <g stroke="#4f4e43" stroke-width="2">
      <path d="M1142 440l8 13M1168 440l7 12M1275 440l-6 12M1301 440l-8 13"/>
      <path d="M1169 452v139M1276 452v139"/>
