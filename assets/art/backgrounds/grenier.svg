  <!-- Sheet music on floor -->
  <g>
    <g transform="translate(695 793) rotate(9)">
      <path d="M0 0h138l16 71H0Z" fill="#c8bca3" opacity=".72"/>
      <g stroke="#766c58" opacity=".43" stroke-width="1">
        <path d="M16 16h91M13 24h101M20 32h86M15 40h97M19 48h84M14 56h93"/>
      </g>
      <g fill="#5f5646" opacity=".55">
        <ellipse cx="52" cy="23" rx="4" ry="3" transform="rotate(-18 52 23)"/>
        <ellipse cx="90" cy="39" rx="4" ry="3" transform="rotate(-18 90 39)"/>
      </g>
    </g>
    <g transform="translate(1200 735) rotate(-12)">
      <path d="M0 0h128l-8 91H0Z" fill="#c3b59b" opacity=".56"/>
      <g stroke="#786b55" opacity=".32" stroke-width="1">
        <path d="M14 17h89M13 25h78M16 33h90M15 41h67M18 49h82M14 58h94"/>
      </g>
    </g>
  </g>

  <!-- Floor -->
  <path d="M0 764 1600 622v278H0Z" fill="url(#floor)"/>
  <g stroke="#5a4937" stroke-width="1.2" opacity=".19">
    <path d="M0 813 1600 675M0 872 1600 737"/>
    <path d="M196 900 322 795M494 900 583 768M799 900 853 741M1106 900 1112 716M1418 900 1372 693"/>
  </g>

  <!-- Dust motes in light -->
  <g fill="#ece1c9" opacity=".43">
    <circle cx="609" cy="348" r="1.5"/><circle cx="677" cy="297" r="1.1"/><circle cx="735" cy="389" r="1.7"/>
    <circle cx="784" cy="330" r="1"/><circle cx="608" cy="456" r="1.4"/><circle cx="709" cy="501" r="1.2"/>
    <circle cx="826" cy="446" r="1.1"/><circle cx="560" cy="522" r="1.3"/><circle cx="648" cy="565" r="1"/>
    <circle cx="879" cy="514" r="1.4"/><circle cx="485" cy="371" r="1"/><circle cx="1012" cy="381" r="1.2"/>
