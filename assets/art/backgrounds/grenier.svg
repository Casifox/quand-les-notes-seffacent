    <path d="M626 605h463c16 0 28 12 28 28v27H598v-27c0-16 12-28 28-28Z" fill="#634d35"/>
    <path d="M598 660h519v39H598Z" fill="#171512"/>
    <path d="M598 819h519v11H598Z" fill="#0f0e0c"/>
    <g fill="#897052">
      <path d="M662 605h24v224h-24Z"/>
      <path d="M1028 605h24v224h-24Z"/>
      <path d="M620 643h474v8H620Z"/>
