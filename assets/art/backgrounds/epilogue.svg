<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#536e77"/>
      <stop offset=".28" stop-color="#8d9b9c"/>
      <stop offset=".56" stop-color="#d6bda8"/>
      <stop offset=".76" stop-color="#e8cba9"/>
      <stop offset="1" stop-color="#f2d9b5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b49a8e"/>
      <stop offset=".23" stop-color="#829693"/>
      <stop offset=".6" stop-color="#5e7e7d"/>
      <stop offset="1" stop-color="#365a60"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4af94"/>
      <stop offset=".5" stop-color="#ab9478"/>
      <stop offset="1" stop-color="#75634f"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5e4e"/>
      <stop offset="1" stop-color="#26312e"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2d5" stop-opacity=".85"/>
      <stop offset=".3" stop-color="#f4d8ad" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f4d8ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glowPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d6aa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f5d6aa" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
