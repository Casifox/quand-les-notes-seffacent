<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9699"/>
      <stop offset=".36" stop-color="#adb7b1"/>
      <stop offset=".7" stop-color="#d6cdb8"/>
      <stop offset="1" stop-color="#c9bca5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#738b8b"/>
      <stop offset=".3" stop-color="#54777a"/>
      <stop offset=".72" stop-color="#396066"/>
      <stop offset="1" stop-color="#244c53"/>
    </linearGradient>
    <linearGradient id="wetSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a79a83"/>
      <stop offset="1" stop-color="#766e5e"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a98f"/>
      <stop offset=".45" stop-color="#a8967c"/>
      <stop offset="1" stop-color="#6e5e49"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5750"/>
      <stop offset="1" stop-color="#1c2c2b"/>
    </linearGradient>
    <linearGradient id="cliffLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77786a"/>
      <stop offset="1" stop-color="#333f39"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4e5c5" stop-opacity=".82"/>
      <stop offset=".4" stop-color="#e6d4b2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e6d4b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e3d8" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#ecebde" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e2e3d8" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="groyne" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2c26"/>
      <stop offset="1" stop-color="#514b3d"/>
    </linearGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>

