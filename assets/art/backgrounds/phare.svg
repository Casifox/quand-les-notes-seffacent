<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4039"/>
      <stop offset=".48" stop-color="#262c29"/>
      <stop offset="1" stop-color="#10191b"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b7766"/>
      <stop offset="1" stop-color="#3c403a"/>
