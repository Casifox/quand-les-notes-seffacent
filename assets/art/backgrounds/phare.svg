      <stop offset=".5" stop-color="#e7b96f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e7b96f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duskGlow" cx=".5" cy=".5" r=".5">
